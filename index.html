  ok=true;const f=r.feed,en=f.entry||[];tot=+((f['openSearch$totalResults']||{}).$t)||tot;

 r.innerHTML=`<div class="in"><div class="bar"><button class="btn o" data-a="close">${t('back')}</button></div><div class="dt">${dstr(p.date)}</div><h2 style="font-size:1.4em;margin:6px 0">${esc(p.title)}</h2><div>${chips(p)}</div><div class="body">${p.html}</div>
<div class="row"><button class="btn${lk?'':' o'}" data-a="like" data-id="${id}">${lk?'❤️':'🤍'} ${t('like')}</button><button class="btn o" data-a="share" data-id="${id}">↗ ${t('share')}</button><button class="btn o" data-a="mark" data-id="${id}">🔖 ${bm?t('unsave'):t('save')}</button><a class="btn o" href="${p.link}" target="_blank" rel="noopener">🌐 ${t('orig')}</a></div>
<h2>${t('cm')}</h2><div id="cm"></div><footer>${C.copyright}</footer></div>`;
 r.style.display='block';r.scrollTop=0;if(!np)history.pushState({r:1},'');
 const g=C.giscus;if(g.repo){const s=document.createElement('script');s.src='https://giscus.app/client.js';s.async=true;s.crossOrigin='anonymous';Object.entries({'data-repo':g.repo,'data-repo-id':g.repoId,'data-category':g.category,'data-category-id':g.categoryId,'data-mapping':'specific','data-term':id,'data-theme':document.body.clientWidth&&matchMedia('(prefers-color-scheme:dark)').matches&&P.theme==='auto'||P.theme==='dark'?'dark':'light','data-lang':'en'}).forEach(([k,v])=>s.setAttribute(k,v));$('#cm').appendChild(s)}else $('#cm').innerHTML=`<a class="btn" href="${p.link}#comments" target="_blank" rel="noopener">💬 ${t('cmb')}</a>`}
function closeP(){$('#rd').style.display='none'}
let dp=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e});
function toast(s){alert(s)}
async function share(u,ti){try{if(navigator.share)await navigator.share({title:ti,url:u});else{await navigator.clipboard.writeText(u);toast(t('cp'))}}catch(e){}}
document.addEventListener('click',e=>{const x=e.target.closest('[data-a],[data-v],[data-o],[data-l],[data-y],[data-s]');if(!x)return;const d=x.dataset;
 if(d.v){S.view=d.v;S.label=null;S.ym=null;draw();scrollTo(0,0)}
 else if(d.o)openP(d.o);else if(d.l){S.label=d.l;draw()}else if(d.y){S.ym=d.y;draw()}
 else if(d.s){P[d.s]=d.x;sv();draw()}
 else if(d.a==='lang'){P.lang=P.lang==='mr'?'en':'mr';sv();draw()}
 else if(d.a==='refresh')load();else if(d.a==='clr'){S.label=null;S.ym=null;draw()}
 else if(d.a==='close')history.back();
 else if(d.a==='like'){const i=S.likes.indexOf(d.id);i<0?S.likes.push(d.id):S.likes.splice(i,1);W('aff_l',S.likes);const sc=$('#rd').scrollTop;openP(d.id,1);$('#rd').scrollTop=sc}
 else if(d.a==='mark'){const i=S.marks.indexOf(d.id);i<0?S.marks.push(d.id):S.marks.splice(i,1);W('aff_b',S.marks);const sc=$('#rd').scrollTop;openP(d.id,1);$('#rd').scrollTop=sc}
 else if(d.a==='share'){const p=S.posts.find(q=>q.id===d.id);share(p.link,p.title)}
 else if(d.a==='sapp')share(location.href.split('#')[0],C.title);
 else if(d.a==='inst'){if(dp){dp.prompt()}else toast(t('ih'))}
 else if(d.a==='fb'){const v=($('#fbt').value||'').trim();if(!v)return;const u=C.feedbackRepo?`https://github.com/${C.feedbackRepo}/issues/new?title=${encodeURIComponent('Feedback')}&body=${encodeURIComponent(v)}`:`mailto:${C.email}?subject=${encodeURIComponent('Feedback: '+C.title)}&body=${encodeURIComponent(v)}`;location.href=u}});
addEventListener('popstate',closeP);
['copy','cut','contextmenu','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{if(!/INPUT|TEXTAREA/.test(e.target.tagName))e.preventDefault()}));
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
draw();load();
</script></body></html>
